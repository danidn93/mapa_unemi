<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Mapa Institucional UNEMI</title>
    <meta name="description" content="Navegación inteligente dentro del campus UNEMI: aulas, oficinas, rutas peatonales y vehiculares con guía por voz." />
    <meta name="author" content="UNEMI" />
    <meta name="theme-color" content="#FF7A1A" />
    <link rel="manifest" href="/manifest.json" />

    <meta property="og:title" content="Mapa Institucional UNEMI" />
    <meta property="og:description" content="Encuentra aulas, oficinas y rutas dentro del campus UNEMI." />
    <meta property="og:type" content="website" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var inIframe = false;
        try { inIframe = window.self !== window.top; } catch (e) { inIframe = true; }
        var host = location.hostname;
        var isPreview = host.includes("lovableproject.com") || host.indexOf("id-preview--") !== -1;
        if ("serviceWorker" in navigator) {
          if (inIframe || isPreview) {
            navigator.serviceWorker.getRegistrations().then(function (regs) {
              regs.forEach(function (r) { r.unregister(); });
            });
          } else {
            window.addEventListener("load", function () {
              navigator.serviceWorker.register("/sw.js").catch(function () {});
            });
          }
        }
      })();
    </script>
  </body>
</html>
